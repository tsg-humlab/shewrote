services:
  web:
    image: ${DOCKER_IMAGE}
    command: gunicorn sw_project.wsgi:application --bind 0.0.0.0:${DJANGO_PORT} --log-level debug --workers=${NUMBER_OF_WORKERS:-4}
    volumes:
      - static_volume:/home/app/web/staticfiles
      - tmp_volume:/home/app/web/tmp
      - writable_volume:/home/app/web/writable/media
    expose:
      - ${DJANGO_PORT}
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - postgres_dumps:/postgres_dumps
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    restart: unless-stopped
  redis:
    image: redis:latest
    restart: unless-stopped
    expose:
      - 6379
  nginx:
    image: nginx:1.25
    volumes:
      - static_volume:/home/app/web/staticfiles
      - writable_volume:/home/app/web/writable/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_dumps:
  static_volume:
  tmp_volume:
  writable_volume:
